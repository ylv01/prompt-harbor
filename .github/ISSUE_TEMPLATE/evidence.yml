name: Evidence correction or addition
description: Add a source or correct a task-specific claim.
body:
  - type: textarea
    attributes:
      label: Model and task
      description: Exact model/version, affected task and proposed correction.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Source and setup
      description: Primary URL, date, metric, reasoning effort, tools/harness, limitations.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Public prompt/test steps, expected and observed result. Remove private data.
  - type: textarea
    attributes:
      label: Community provenance
      description: For community reports, provide original author/team, firsthand or artifact-backed status, positive and negative findings, original date, known reposts, and any sponsorship. Likes are not an evidence multiplier.
